[project]
name = "agentic-incident-response"
version = "1.0.0"
description = "Agentic On-Call Incident Response System — a multi-agent LangGraph system with production-grade failure handling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Internal" }
authors = [{ name = "Incident Response Team" }]

# Dependencies are pinned to the floors mandated by the PRD (§2.3 Technical Requirements).
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "langsmith>=0.1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
]

[project.optional-dependencies]
# HTTP deployment layer (server/ package) — install with `uv sync --extra server`.
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    # Server deps repeated here so `uv sync --extra dev` can run tests/test_server.py
    # (httpx is required by FastAPI's TestClient).
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
incident-response = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat package layout mirrors the paths referenced throughout the PRD
# (state/, tools/, utils/, agents/, evaluation/, config.py, main.py).
packages = ["state", "tools", "utils", "agents", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests favour long, readable assertions, parametrize rows, and compact
# semicolon setup lines over rigid wrapping; product code stays strict at 100.
"tests/**" = ["E501", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Test functions receive pytest fixtures/parametrize values that fight strict
# signature typing; behaviour is validated by running them. Product code stays strict.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Third-party MCP adapter ships without type stubs.
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
